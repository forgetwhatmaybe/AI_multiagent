[project]
name = "knowledge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "python-dotenv",
    "langchain-core",
    "langchain-community",
    "langchain-openai",
    "langchain-chroma",
    "pydantic-settings",
    "markdownify",
    "scikit-learn",
    "jieba",
    "unstructured",
    "markdown",
    "python-multipart",
    "onnxruntime<1.20",
    "langchain-huggingface>=1.2.2",
    "sentence-transformers",
    "torch==2.5.1+cu121",
    "transformers>=4.46,<5",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu121"]
index-strategy = "unsafe-best-match"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "config", "repositories", "schemas", "services", "utils"]

